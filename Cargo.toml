[package]
name = "cosmicdrop"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "An open Apple AirDrop implementation for the COSMIC desktop, with a GUI applet"

[dependencies]
anyhow = "1"
log = "0.4"
env_logger = "0.11"
mdns-sd = { version = "0.11", features = ["async"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
plist = "1"
tokio-rustls = "0.25"
rustls = "0.22"
rustls-pemfile = "2"
rcgen = "0.13"
rand = "0.8"
base64 = "0.22"
tar = "0.4"
flate2 = "1"
walkdir = "2"
if-addrs = "0.13"
hostname = "0.4"
chrono = "0.4"
once_cell = "1"
image = "0.25"
rfd = "0.14"

# Low-level networking for the embedded AWDL (OWL) implementation
libc = "0.2"
nix = { version = "0.29", features = ["net", "socket", "ioctl", "uio", "poll", "process", "sched", "signal", "time"] }
byteorder = "1"
crc32fast = "1"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
features = [
    "applet",
    "applet-token",
    "tokio",
    "wayland",
    "winit",
    "multi-window",
]

[profile.release]
lto = true
strip = true
